[project]
name = "compclass"
version = "0.1.0"
description = "Optional local env for the self-contained component-classification notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29,<7",
    "joblib>=1.4.0",
    "jupyter-client>=8.6,<9",
    "kaggle>=1.6.0",
    "matplotlib>=3.9.0",
    "notebook>=7.2.0",
    "optuna>=4.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "rich>=13.9.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false
