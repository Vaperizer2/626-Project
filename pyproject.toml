[project]
name = "compclass"
version = "0.2.0"
description = "Electronic-component image classification: one package, many model families, honest grouped CV."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.15",            # hosts CNN, ViT, Swin, DINOv2, CLIP and SigLIP image towers
    "open_clip_torch>=2.32",   # only for zero-shot text towers
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "pillow-avif-plugin>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "rich>=13.9",
    "onnx>=1.17",
    "onnxscript>=0.2",         # needed by torch.onnx's dynamo exporter
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ipykernel>=6.29", "jupyterlab>=4.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compclass"]

[tool.uv]
package = true

# CUDA 12.8 wheels on Linux (GPU PC: RTX 4060 Ti, sm_89). `explicit = true` means
# only the packages listed in [tool.uv.sources] are fetched from this index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
