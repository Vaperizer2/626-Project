base: scratch_cnn.yaml
# Model A + distillation: the same from-scratch CNN, trained 300 epochs against the soft targets of a per-fold
# SigLIP So400m linear probe (tools/make_teacher.py --cross-fit). Not "from scratch" in the strict sense: no
# pretrained weights and no extra images, but the training signal comes from a pretrained model. Development
# folds 0-4 macro-F1 0.4361 vs 0.3903 for the plain 200-epoch recipe (docs/SCRATCH_CNN_IMPROVEMENT_LOG.md, entry 22).
name: scratch_cnn_distill
train:
  epochs: 300
  patience: 60
  distill:
    teacher: results/cache/teacher/probe_siglip_so400m_384_xfit_fold{fold}.npz
    alpha: 0.9
    temperature: 2
