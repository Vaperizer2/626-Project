[workspace]
resolver = "3"
members = ["crates/inference", "apps/gpui-demo"]
exclude = ["vendor/gpui-pre-windows", "tools/windows-shader-check"]

# Profiles live here: cargo ignores them in member manifests.
[profile.release]
opt-level = 3
debug = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

# "*" leaves out workspace members. Unoptimised, inference's pixel loops make the GUI tests' demo-stack decode 10x slower.
[profile.dev.package.inference]
opt-level = 2

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
